<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>招投标材料平台 · 测试版</title>
  <style>
    :root { color-scheme: light; --line: #d8dee6; --ink: #1c2430; --muted: #5c6b7a; --accent: #0f6b4c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); background: #f4f6f8; }
    header { background: #123; color: #fff; padding: 16px 24px; }
    header p { margin: 4px 0 0; color: #c9d4df; font-size: 13px; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
    input, select, button, textarea { font: inherit; }
    input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button.ghost { background: #e8eef2; color: var(--ink); }
    button.warn { background: #8a4b12; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .project { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-top: 8px; cursor: pointer; }
    .project.active { border-color: var(--accent); background: #f3faf7; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 8px 6px; vertical-align: top; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 99px; background: #eef2f5; font-size: 12px; }
    .low { background: #fff1d6; }
    .note { color: var(--muted); font-size: 13px; }
    .banner { background: #fff8e8; border: 1px solid #ead7a2; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <strong>招投标材料智能编制与核验平台 · 测试版</strong>
    <p>阶段 1：导入招标文件 → 规则抽取要求矩阵 → 人工确认。不调用外部模型，不代签章、不代提交。</p>
  </header>
  <main>
    <section>
      <h2>投标项目</h2>
      <label>项目名称</label>
      <input id="name" placeholder="例如：某泵站设备采购" />
      <label>项目编号</label>
      <input id="code" />
      <label>投标主体</label>
      <input id="bidder" />
      <label>截止时间</label>
      <input id="deadline" placeholder="2026-11-30 09:30" />
      <div class="row"><button id="create">创建项目</button></div>
      <div id="projects"></div>
    </section>
    <section>
      <h2 id="title">要求矩阵</h2>
      <div class="banner">抽取结果是检查提示。关键条款、低置信项和空白扫描页都要人工确认，系统不会补全读不出的内容。</div>
      <div id="docs" class="note">先创建或选择一个项目。</div>
      <div class="row">
        <input id="file" type="file" accept=".txt,.md,.pdf,.docx" />
        <button id="upload">导入文件</button>
      </div>
      <h2 style="margin-top:16px">人工补一条</h2>
      <div class="row">
        <select id="category">
          <option>资格</option><option>评分</option><option>格式</option><option>签章</option>
          <option>时间</option><option>商务</option><option>技术</option><option>其他</option>
        </select>
        <input id="content" placeholder="要求原文或补录说明" />
        <button id="add" class="ghost">加入矩阵</button>
      </div>
      <table>
        <thead>
          <tr><th>类别</th><th>要求</th><th>出处</th><th>置信</th><th>状态</th><th></th></tr>
        </thead>
        <tbody id="matrix"></tbody>
      </table>
    </section>
  </main>
  <script>
    let current = null;
    const $ = (id) => document.getElementById(id);

    async function loadProjects() {
      const rows = await (await fetch("/api/projects")).json();
      $("projects").innerHTML = rows.map((p) => `
        <div class="project ${p.id === current ? "active" : ""}" data-id="${p.id}">
          <strong>${escapeHtml(p.name)}</strong>
          <div class="note">${escapeHtml(p.code || "无编号")} · 待确认 ${p.pending_count}/${p.requirement_count}</div>
        </div>`).join("");
      document.querySelectorAll(".project").forEach((el) => {
        el.onclick = () => openProject(Number(el.dataset.id));
      });
    }

    async function openProject(id) {
      current = id;
      const data = await (await fetch(`/api/projects/${id}`)).json();
      const p = data.project;
      $("title").textContent = `要求矩阵 · ${p.name}`;
      $("docs").innerHTML = data.documents.length
        ? data.documents.map((d) => `<div>${escapeHtml(d.filename)} · ${escapeHtml(d.parse_note)}</div>`).join("")
        : "还没有导入文件。";
      $("matrix").innerHTML = data.requirements.map((r) => `
        <tr>
          <td><span class="tag">${escapeHtml(r.category)}</span></td>
          <td>${escapeHtml(r.content)}</td>
          <td>${escapeHtml(r.source_file)}<br><span class="note">${escapeHtml(r.source_location)}</span></td>
          <td><span class="tag ${r.confidence === "low" ? "low" : ""}">${escapeHtml(r.confidence)}</span></td>
          <td>${label(r.status)}</td>
          <td>
            <button class="ghost" data-act="confirmed" data-id="${r.id}">确认</button>
            <button class="ghost" data-act="not_applicable" data-id="${r.id}">不适用</button>
          </td>
        </tr>`).join("");
      $("matrix").querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => patch(Number(btn.dataset.id), { status: btn.dataset.act });
      });
      loadProjects();
    }

    function label(status) {
      return { pending: "待确认", confirmed: "已确认", not_applicable: "不适用" }[status] || status;
    }

    async function patch(id, body) {
      await fetch(`/api/requirements/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      openProject(current);
    }

    $("create").onclick = async () => {
      const body = {
        name: $("name").value.trim(),
        code: $("code").value.trim(),
        bidder: $("bidder").value.trim(),
        deadline: $("deadline").value.trim(),
      };
      if (!body.name) return alert("请填写项目名称");
      const created = await (await fetch("/api/projects", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })).json();
      $("name").value = "";
      openProject(created.id);
    };

    $("upload").onclick = async () => {
      if (!current) return alert("请先选择项目");
      const file = $("file").files[0];
      if (!file) return alert("请选择文件");
      const form = new FormData();
      form.append("file", file);
      const res = await fetch(`/api/projects/${current}/documents`, { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) return alert(data.detail || "导入失败");
      alert(`${data.parse_note}\n抽出 ${data.extracted} 条，请在矩阵里确认。`);
      openProject(current);
    };

    $("add").onclick = async () => {
      if (!current) return alert("请先选择项目");
      const content = $("content").value.trim();
      if (!content) return alert("请填写要求");
      await fetch(`/api/projects/${current}/requirements`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: $("category").value, content }),
      });
      $("content").value = "";
      openProject(current);
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    loadProjects();
  </script>
</body>
</html>
